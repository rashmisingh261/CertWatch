name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --config pyproject.toml . ../scripts
      - name: Tests (pytest)
        run: pytest

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Tests (vitest)
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build --wait --wait-timeout 180
      - name: Smoke test through the web proxy
        run: |
          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent http://127.0.0.1:8080/api/health
          # Validation errors need no outbound network access.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/inspect \
            -H 'Content-Type: application/json' -d '{"domain":"localhost"}')" = "422"
          curl --fail --silent http://127.0.0.1:8080/api/monitor
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
