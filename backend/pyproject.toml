[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade (safe subset below)
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's idiomatic `param = File(...)` / `Depends(...)` defaults are not mutable-default bugs.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends"]
